<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#grad)" />

  <!-- Briefcase icon -->
  <rect x="140" y="210" width="232" height="150" rx="20" fill="white"/>
  <rect x="200" y="170" width="112" height="60" rx="12" fill="white"/>
  <rect x="140" y="260" width="232" height="20" fill="#e5e7eb"/>

  <!-- JP text -->
  <text x="256" y="430" font-size="60" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    JP
  </text>
</svg>
